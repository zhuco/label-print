name: Bug Report
description: 提交缺陷问题
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 版本号
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 操作系统、分辨率、缩放比例、打印机型号
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 请附导出的日志或截图