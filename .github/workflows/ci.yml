name: CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check text encoding and mojibake
        run: pnpm check:mojibake

      - name: Lint TypeScript workspaces
        run: pnpm -r --filter '!@label/e2e' lint

      - name: Run TypeScript tests
        run: pnpm -r --filter '!label-print' --filter '!@label/e2e' test

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install Playwright browser
        run: pnpm --filter @label/e2e exec playwright install chromium

      - name: Run responsive E2E
        run: pnpm --filter @label/e2e test responsive.spec.ts --project=chromium
