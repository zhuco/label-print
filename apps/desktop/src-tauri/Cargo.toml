[package]
name = "label-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "label_desktop"
path = "src/lib.rs"

[[bin]]
name = "label-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
fontdb = "0.17"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/label-core"]
