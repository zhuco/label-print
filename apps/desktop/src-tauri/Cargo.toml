[package]
name = "label-desktop"
version = "0.1.1"
edition = "2021"

[lib]
name = "label_desktop"
path = "src/lib.rs"

[[bin]]
name = "label-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
fontdb = "0.17"
url = "2"
base64 = "0.22"
printpdf = { version = "0.9.1", default-features = false, features = ["png"] }
rfd = "0.14"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/label-core"]
