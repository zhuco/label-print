[package]
name = "label-desktop"
version = "0.1.3"
edition = "2021"

[lib]
name = "label_desktop"
path = "src/lib.rs"

[[bin]]
name = "label-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["winrt-ocr"]
# Windows Runtime OCR requires Windows 10 APIs. The legacy Win7 build switches
# its staged manifest to `legacy-win7`, retaining barcode recognition and the
# existing Tesseract fallback without linking WinRT.
winrt-ocr = ["dep:windows"]
legacy-win7 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
fontdb = "0.17"
url = "2"
base64 = "0.22"
printpdf = { version = "0.9.1", default-features = false, features = ["png"] }
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
image24 = { package = "image", version = "0.24", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
bardecoder = "0.5"
rqrr = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", optional = true, features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/label-core"]
