name: label-cloud

# Production topology for one VPS. Values are loaded exclusively from .env in
# the deployed directory; do not commit that file or expose database ports.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-label_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-label}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - label-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-tauri://localhost}
    ports:
      - "127.0.0.1:9000:9000"
      # The administration console is deliberately loopback-only.
      - "127.0.0.1:9001:9001"
    volumes:
      - label-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    env_file: .env
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing local/"$$S3_BUCKET"

  api:
    image: ${LABEL_CLOUD_IMAGE:-label-cloud-api:latest}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-label}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-label_cloud}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      # Caddy reaches the published loopback port through this fixed gateway.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.30.0.1}
    command: >-
      /bin/sh -ec "pnpm --filter @label/server migrate && exec pnpm --filter @label/server start"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    ports:
      # Public traffic must come through Caddy, never directly through this port.
      - "127.0.0.1:8787:8787"

volumes:
  label-postgres:
  label-minio:

networks:
  default:
    name: label-cloud-network
    ipam:
      config:
        # Deliberately separate from the existing 172.17/18/19 Docker networks.
        - subnet: 172.30.0.0/24
